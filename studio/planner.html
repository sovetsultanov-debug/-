<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Планировщик поездки — Saiyakat Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Caveat:wght@500;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="studio.css" />
  <link rel="stylesheet" href="planner.css" />
</head>
<body>
  <header class="bar no-print">
    <a href="./">← Студия</a>
    <b>Планировщик поездки</b>
    <div class="bar-actions">
      <div class="swatches" id="theme">
        <button type="button" data-theme="classic" class="is-active">Классика</button>
        <button type="button" data-theme="saiyakat">Saiyakat</button>
      </div>
      <div class="swatches" id="lang">
        <button type="button" data-lang="en" class="is-active">EN</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
      <button id="print" data-print>Печать / PDF</button>
      <button id="download" class="primary">Готовая картинка</button>
    </div>
  </header>

  <div class="sheet-wrap">
    <!-- A4 sheet: 794×1123 CSS px (96 dpi). Days are generated by planner.js. -->
    <article class="sheet theme-classic" id="sheet">
      <header class="sheet-head">
        <svg class="head-pin" viewBox="0 0 64 80" aria-hidden="true">
          <path d="M32 78C32 78 4 48 4 28a28 28 0 0 1 56 0c0 20-28 50-28 50z" fill="var(--accent)" />
          <path d="M32 78C32 78 4 48 4 28a28 28 0 0 1 28-28v78z" fill="var(--accent-dark)" opacity="0.35" />
          <circle cx="32" cy="28" r="12" fill="var(--paper)" />
        </svg>
        <div class="head-script">
          <span data-i18n="travel">Travel</span>
          <svg viewBox="0 0 200 20" aria-hidden="true"><path d="M4 14 Q 90 2 196 10" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" /></svg>
        </div>
        <h1 class="head-title">
          <span data-i18n="itinerary">ITINERARY</span>
          <span data-i18n="planner">PLANNER</span>
        </h1>
      </header>
      <div id="days"></div>
    </article>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="save.js"></script>
  <script src="planner.js"></script>
</body>
</html>
